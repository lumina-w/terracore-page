name: Claude Code

on:
  issues:
    types: [labeled]

jobs:
  claude:
    if: github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 20
          prompt: |
            Read issue #${{ github.event.issue.number }} ("${{ github.event.issue.title }}"), the
            event that triggered this run, including its full body, to understand what is being
            asked.

            Before writing any code, read this repository's CLAUDE.md for the branch naming
            convention, the commit message format, and the branch flow (which branch a pull
            request should target).

            Then:
            1. Create a new branch off `dev` following CLAUDE.md's naming convention. Never branch
               from or push directly to `main` or `dev`.
            2. Implement a solution for the issue.
            3. Run this repository's tests, lint, and build locally (see CLAUDE.md for the exact
               commands). Fix anything that fails before continuing.
            4. Commit the changes following this repository's commit convention from CLAUDE.md.
            5. Push the branch.
            6. Open a pull request targeting `dev`, referencing issue #${{ github.event.issue.number }}
               in the description. Never push directly to `main` or `dev`.
